server:
  port: 8080

spring:
  application:
    name: syed-apiqa-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/syed_apiqa}
    username: ${SPRING_DATASOURCE_USERNAME:apiqa_user}
    password: ${SPRING_DATASOURCE_PASSWORD:apiqa_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

syed:
  safety:
    ssrf-protection-enabled: true
    production-delete-enabled: false
    max-concurrency: 10
    default-timeout-seconds: 15
    max-response-size-bytes: 2097152 # 2MB
  security:
    auth-enabled: true
    test-mode: false
    allowed-origins: ${SYED_SECURITY_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
    auth-secret: ${SYED_AUTH_SECRET:dev-insecure-auth-secret-change-in-production-32b}
    encryption-key: ${SYED_ENCRYPTION_KEY:dev-insecure-encryption-key-change-in-production}
