server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:syed_apiqa_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false

syed:
  safety:
    ssrf-protection-enabled: false # Disabled for integration tests targeting local WireMock mock server
    allow-local-targets: true
    max-concurrency: 5
    production-delete-enabled: false
    default-timeout-seconds: 5
  security:
    auth-enabled: false
    test-mode: true
    auth-secret: test-secret-key-for-unit-testing-32bytes-long!
    encryption-key: test-encryption-key-for-unit-testing-32bytes!
