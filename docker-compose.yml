version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: syed-apiqa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: syed_apiqa
      POSTGRES_USER: apiqa_user
      POSTGRES_PASSWORD: apiqa_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apiqa_user -d syed_apiqa"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: syed-apiqa-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/syed_apiqa
      SPRING_DATASOURCE_USERNAME: apiqa_user
      SPRING_DATASOURCE_PASSWORD: apiqa_password
      SERVER_PORT: 8080
      SYED_SAFETY_SSRF_PROTECTION_ENABLED: "true"
      SYED_SAFETY_PRODUCTION_DELETE_ENABLED: "false"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: syed-apiqa-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"

volumes:
  pgdata:
